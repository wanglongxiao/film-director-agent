[project]
name = "aw-director-agent"
version = "0.1.0"
description = "aw-director-agent — 电影剧本智能助手（VeADK + AgentKit Runtime）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "veadk-python>=1.0.9",
]

[project.scripts]
aw-director-agent = "aw_director_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
