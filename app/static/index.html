<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="title">Movie Script Agent</title>
  <link rel="stylesheet" href="/style.css?v=20261025-5" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">&#127916;</span> <span data-i18n="brand">Movie Script Agent</span></div>
    <div class="topbar-actions">
      <label class="model-label" for="text-model" data-i18n="textModel">剧本模型</label>
      <select id="text-model" disabled>
        <option value="deepseek-1017" selected>deepseek-1017</option>
        <option value="seed-sc-0215">seed-sc-0215</option>
      </select>
      <label class="lang-label" for="lang" data-i18n="language">Language</label>
      <select id="lang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
      <button id="new-task" class="ghost" data-i18n="newTask">New Task</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat-panel">
      <div class="manuscript-tools">
        <div class="tools-controls">
        <div class="view-tabs" role="group" data-i18n-attr="aria-label:viewLabel" aria-label="创作视图">
          <button id="view-chat" class="secondary" data-i18n="discussion">创作讨论</button>
          <button id="view-novel" class="ghost" data-i18n="manuscript">小说正文</button>
        </div>
        <div class="novel-form">
          <label><span data-i18n="chapterCountShort">章数</span>
            <input id="chapter-count" type="number" required data-i18n-attr="aria-label:chapterCount" /></label>
          <label><span data-i18n="chapterLengthShort">字/章</span>
            <input id="chapter-length" type="number" required data-i18n-attr="aria-label:chapterLength" /></label>
          <button id="novel-gen" class="primary" disabled data-i18n="generateNovel">生成完整正文</button>
          <button id="word-export" class="secondary" disabled data-i18n="exportWord">导出 Word</button>
        </div>
        </div>
        <div id="novel-status" class="muted" role="status" aria-live="polite" data-i18n="novelHint">先设置章数和篇幅，完成角色侧写和大纲，再生成正文并保存。</div>
      </div>
      <div id="messages" class="messages"></div>
      <div id="manuscript" class="manuscript hidden">
        <div class="empty" data-i18n="novelEmpty">章节目录和完整正文将显示在这里。</div>
      </div>
      <div class="composer">
        <div class="composer-input">
          <input id="input" type="text" data-i18n-attr="placeholder:inputPlaceholder" placeholder="Describe your script idea…" autocomplete="off" />
          <div id="speech-status" class="muted" role="status" aria-live="polite"></div>
        </div>
        <div class="composer-actions">
          <button id="record" class="secondary" type="button" disabled aria-pressed="false" data-i18n="recordAudio">录音</button>
          <button id="send" class="primary" data-i18n="send">Send</button>
          <button id="stop" class="danger hidden" data-i18n="stop">Stop</button>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="side-scroll">
        <h2 data-i18n="referenceImages">Reference Images</h2>
        <div id="ref-output" class="ref-output">
          <div class="empty" data-i18n="refEmpty">Character portraits and key scene references will appear here.</div>
        </div>
      </div>
      <div class="side-actions">
        <div class="episode-form">
          <label><span data-i18n="totalImages">图片数</span> <input id="ref-total" type="number" required data-i18n-attr="title:refTotalHint" /></label>
          <button id="ref-gen" class="secondary" data-i18n="generateRefs">生成</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="/i18n.js?v=20261025-5"></script>
  <script src="/speech-input.js?v=20261025-5"></script>
  <script src="/app.js?v=20261025-5"></script>
</body>
</html>
