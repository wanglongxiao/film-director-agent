<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>director-agent · 导演助手</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232d; --border: #2a323d;
    --text: #e6edf3; --muted: #8b949e; --accent: #7c5cff; --accent-2: #4b8bff;
    --user: #22384f; --thought: #2a2440; --tool: #1f2d24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
  }
  body.auth-locked { overflow: hidden; }
  .auth-overlay {
    display: none; position: fixed; inset: 0; z-index: 1500;
    background: rgba(8, 11, 16, 0.88); backdrop-filter: blur(8px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .auth-overlay.show { display: flex; }
  .auth-card {
    width: min(92vw, 420px); background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; box-shadow: 0 18px 60px rgba(0,0,0,0.45);
  }
  .auth-card h2 { margin: 0 0 8px; font-size: 20px; }
  .auth-card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  .auth-input {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    font-size: 16px;
  }
  .auth-input:focus { outline: 1px solid var(--accent); }
  .auth-submit {
    width: 100%; height: 44px; border: none; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .auth-submit:disabled { opacity: .6; cursor: not-allowed; }
  .auth-error { min-height: 20px; color: #ff8080; font-size: 13px; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap; justify-content: space-between;
  }
  header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header h1 {
    font-size: 16px; margin: 0; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 16px;
    flex-shrink: 0;
  }
  header .expand-btn-header {
    padding: 6px 10px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; cursor: pointer;
    flex-shrink: 0;
  }
  header .expand-btn-header:hover { background: var(--bg); border-color: var(--accent); }
  body.sidebar-open header .expand-btn-header { display: none; }
  .controls { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-shrink: 0; }
  .controls #target { max-width: 160px; }
  select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .auto-toggle.active { color: #fff; border-color: var(--accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .auto-banner {
    display: none; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 12px; background: #211b35; border-bottom: 1px solid var(--border);
    color: var(--text); font-size: 13px; text-align: center;
  }
  .auto-banner.show { display: flex; }
  .countdown {
    min-width: 28px; padding: 2px 8px; border-radius: 999px;
    color: #fff; background: var(--accent); font-weight: 700;
  }
  select:focus { outline: 1px solid var(--accent); }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #3fb950; } .dot.bad { background: #f85149; }

  /* 主体布局：左侧历史会话栏 + 右侧对话区 */
  .layout { flex: 1; display: flex; min-height: 0; position: relative; }
  .sidebar {
    width: 244px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0;
    transition: width 0.2s ease, border-right-width 0.2s ease, transform 0.2s ease;
    overflow: hidden;
  }
  .sidebar.collapsed {
    width: 0;
    border-right-width: 0;
  }
  .sidebar-head { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar-head .new { flex: 1; font-weight: 600; }
  .sidebar-head .clear { flex: 0 0 auto; }
  .sidebar-head .clear:hover { color: #f85149; border-color: #f85149; }
  .sidebar-head .collapse-btn { flex: 0 0 auto; padding: 6px 10px; }
  .session-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .session-item {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; color: var(--text); font-size: 13px; border: 1px solid transparent;
  }
  .session-item:hover { background: var(--panel-2); }
  .session-item.active { background: var(--panel-2); border-color: var(--border); }
  .session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-del {
    background: transparent; border: none; color: var(--muted); padding: 2px 6px;
    border-radius: 6px; font-size: 15px; line-height: 1; opacity: 0; flex: 0 0 auto;
  }
  .session-item:hover .session-del, .session-item.active .session-del { opacity: 1; }
  .session-del:hover { color: #f85149; background: var(--bg); }
  .sidebar-foot { padding: 8px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .sidebar-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 9; opacity: 0; transition: opacity 0.2s ease;
  }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: grid;
    place-items: center; font-size: 14px; background: var(--panel-2);
  }
  .msg .bubble {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.6;
    font-size: 14px; max-width: 100%;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble { background: var(--user); }
  .msg.user .avatar { background: var(--accent-2); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; background: var(--tool);
  }
  .chip.thinking { background: var(--thought); }
  details.thought { margin: 4px 0; }
  details.thought summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.thought .content {
    color: var(--muted); font-size: 13px; white-space: pre-wrap; margin-top: 6px;
    border-left: 2px solid var(--border); padding-left: 10px;
  }
  .empty { color: var(--muted); font-size: 14px; text-align: center; margin-top: 40px; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px; }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; line-height: 1.5; max-height: 160px; font-family: inherit;
  }
  textarea:focus { outline: 1px solid var(--accent); }
  .send { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none;
    color: #fff; font-weight: 600; padding: 10px 18px; height: 42px; }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  .stop {
    display: none; height: 42px; padding: 10px 18px; color: #fff; font-weight: 600;
    background: #a52834; border-color: #c93c49;
  }
  /* 发送 / 停止 交替显示：空闲仅显示「发送」，执行中仅显示「停止」 */
  body.is-busy .send { display: none; }
  body.is-busy .stop { display: inline-flex; align-items: center; }
  .hint { max-width: 860px; margin: 6px auto 0; font-size: 11px; color: var(--muted); }
  .blink::after { content: "▋"; animation: b 1s steps(2) infinite; color: var(--accent); }
  @keyframes b { 0%,100%{opacity:1} 50%{opacity:0} }
  /* Agent 生成的文件（图片/视频/文档）附件 */
  .attachments {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px; margin-top: 10px;
  }
  .attachments:empty { display: none; }
  .att-image-link { display: block; min-width: 0; }
  .att-img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    border-radius: 10px; border: 1px solid var(--border); cursor: zoom-in;
  }
  /* 图片放大查看（lightbox）：点击缩略图放大，点击遮罩/图片/按 Esc 恢复 */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.86); align-items: center; justify-content: center;
    padding: 24px; cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 96vw; max-height: 92vh; object-fit: contain;
    border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .lightbox .lb-close {
    position: absolute; top: 16px; right: 20px; font-size: 26px; line-height: 1;
    color: #fff; background: rgba(255,255,255,0.12); border: none; border-radius: 999px;
    width: 40px; height: 40px; cursor: pointer;
  }
  .lightbox .lb-close:hover { background: rgba(255,255,255,0.24); }
  .att-video-card {
    grid-column: span 3; min-width: 0; padding: 10px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  }
  .att-video {
    width: 100%; aspect-ratio: 16 / 9; display: block;
    border-radius: 8px; border: 1px solid var(--border); background: #000;
  }
  .att-video-link {
    display: block; margin-top: 8px; color: var(--accent-2); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none;
  }
  .att-video-link:hover { text-decoration: underline; }
  .att-copy-url {
    margin-top: 6px; font-size: 12px; padding: 4px 10px; border-radius: 8px;
  }
  .att-doc {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
  }
  .att-doc .icon { font-size: 22px; }
  .att-doc .info { flex: 1; min-width: 0; }
  .att-doc .fname { font-size: 13px; color: var(--text); word-break: break-all; }
  .att-doc .ftype { font-size: 11px; color: var(--muted); }
  .att-doc a, .att-doc button {
    color: #fff; text-decoration: none; font-size: 12px; padding: 6px 10px;
    border-radius: 8px; background: var(--accent-2); white-space: nowrap;
    cursor: pointer; font-family: inherit; line-height: 1.4;
  }
  .att-doc a.secondary, .att-doc button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  .att-doc iframe { width: 100%; height: 460px; border: 1px solid var(--border); border-radius: 8px; }
  .doc-preview { grid-column: 1 / -1; margin-top: 8px; }

  /* ============ 响应式：平板 (<=900px) ============ */
  @media (max-width: 900px) {
    header { padding: 10px 14px; gap: 10px; }
    header h1 { font-size: 15px; }
    main { padding: 14px; }
    footer { padding: 10px 14px; }
    .att-doc iframe { height: 360px; }
  }

  /* ============ 响应式：手机 (<=640px) ============ */
  @media (max-width: 640px) {
    /* 单行 header：品牌区左、控制区右，均不换行，靠 h1 省略 + 隐藏在线文案压缩高度 */
    header { padding: 8px 10px; gap: 8px; flex-wrap: nowrap; }
    header .brand { flex: 1 1 auto; min-width: 0; gap: 8px; }
    header h1 { font-size: 14px; }
    .controls { flex: 0 0 auto; gap: 6px; font-size: 12px; }
    .controls #target { max-width: 120px; }
    .controls #statusText { display: none; }  /* 移动端仅保留状态圆点，省空间 */
    .controls .status { gap: 0; }
    header .expand-btn-header { padding: 5px 8px; font-size: 12px; }

    main { padding: 10px; }
    .wrap { gap: 10px; }
    .msg { gap: 8px; }
    .msg .avatar { width: 26px; height: 26px; font-size: 12px; border-radius: 6px; }
    .msg .bubble { padding: 8px 10px; font-size: 13px; border-radius: 10px; }
    .chip { font-size: 10px; padding: 2px 6px; }

    footer { padding: 8px 10px; }
    .composer { gap: 6px; }
    textarea { font-size: 15px; padding: 8px 10px; max-height: 120px; }
    .send, .stop { padding: 8px 14px; height: 40px; font-size: 13px; }
    .hint { font-size: 10px; }

    /* 侧栏在手机上改为覆盖层 (drawer) */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 84vw; max-width: 300px; z-index: 10;
      box-shadow: 4px 0 16px rgba(0,0,0,0.4);
      border-right: 1px solid var(--border);
    }
    .sidebar.collapsed {
      transform: translateX(-100%);
      width: 84vw; max-width: 300px;
      border-right-width: 1px;
    }
    body.sidebar-open .sidebar-backdrop { display: block; opacity: 1; }

    .attachments { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .att-video-card { grid-column: 1 / -1; padding: 8px; }
    .att-doc { flex-wrap: wrap; }
    .att-doc .info { flex: 1 1 100%; order: 1; }
    .att-doc .icon { order: 0; }
    .att-doc a, .att-doc button { order: 2; }
    .att-doc iframe { height: 300px; }
  }

  /* ============ 响应式：超窄 (<=360px) ============ */
  @media (max-width: 360px) {
    header h1 { display: none; }
  }
</style>
</head>
<body>
<div class="auth-overlay" id="authOverlay" aria-hidden="true">
  <div class="auth-card">
    <h2>云端 Web UI 准入</h2>
    <p>此页面已启用访问密码保护。请输入准入密码后继续使用导演助手。</p>
    <form class="auth-form" id="authForm">
      <input id="authPassword" class="auth-input" type="password" placeholder="请输入准入密码" autocomplete="current-password" />
      <button id="authSubmit" class="auth-submit" type="submit">进入</button>
      <div id="authError" class="auth-error"></div>
    </form>
  </div>
</div>
<header>
  <div class="brand">
    <div class="logo">🎬</div>
    <button id="expandSidebar" class="expand-btn-header" title="展开会话栏">☰</button>
    <h1>director-agent · 导演助手</h1>
  </div>
  <div class="controls">
    <button id="autoMode" class="auto-toggle active" type="button" title="自动继续需要用户确认的步骤">自动：开</button>
    <select id="target" title="Agent 目标"></select>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">检测中…</span></span>
  </div>
</header>
<div class="auto-banner" id="autoBanner" aria-live="polite"></div>
<div class="layout">
  <aside class="sidebar collapsed" id="sidebar">
    <div class="sidebar-head">
      <button id="collapseSidebar" class="collapse-btn" title="收起会话栏">←</button>
      <button id="newChat" class="new" title="开启新会话">＋ 新会话</button>
      <button id="clearAll" class="clear" title="清空全部历史会话">🗑 清空</button>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-foot">历史会话保存在本地浏览器，最多保留 20 个</div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="content">
    <main>
      <div class="wrap" id="messages"></div>
    </main>
    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="给「导演助手」下达指令…"></textarea>
        <button class="stop" id="stop" type="button" title="打断当前生成并回到发送前状态">停止</button>
        <button class="send" id="send">发送</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · apikey 由后端保管，不会下发到浏览器</div>
    </footer>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lightboxClose" type="button" title="关闭">×</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");
const sessionListEl = $("sessionList");
const targetEl = $("target");
const inputEl = $("input");
const sendBtn = $("send");
const stopBtn = $("stop");
const autoModeBtn = $("autoMode");
const autoBannerEl = $("autoBanner");
const authOverlayEl = $("authOverlay");
const authFormEl = $("authForm");
const authPasswordEl = $("authPassword");
const authSubmitEl = $("authSubmit");
const authErrorEl = $("authError");
let busy = false;
let activeController = null;
let activeRun = null;
let countdownTimer = null;
let countdownCancel = null;
let autoMode = true;
let authRequired = false;
let authAuthorized = true;

/* ============ 历史会话（localStorage） ============ */
const STORAGE_KEY = "awdir_sessions_v1";
const MAX_SESSIONS = 20;
let sessions = [];      // 最近使用在前
let currentId = null;

function newId() {
  return "webui-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}
function loadSessions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr)) return [];
    return arr.filter((s) => s && s.id).map((s) => ({
      id: s.id,
      title: s.title || "新会话",
      createdAt: s.createdAt || Date.now(),
      updatedAt: s.updatedAt || s.createdAt || Date.now(),
      messages: Array.isArray(s.messages) ? s.messages : [],
    }));
  } catch { return []; }
}
function saveSessions() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }
  catch (e) { console.warn("保存历史会话失败：", e); }
}
function current() { return sessions.find((s) => s.id === currentId) || null; }

function enforceCap() {
  // 超过上限时移除最久未使用的（数组尾部）
  while (sessions.length > MAX_SESSIONS) sessions.pop();
}
function createSession() {
  const s = { id: newId(), title: "新会话", createdAt: Date.now(), updatedAt: Date.now(), messages: [] };
  sessions.unshift(s);
  enforceCap();
  currentId = s.id;
  saveSessions();
  renderSessionList();
  renderMessages();
  inputEl.focus();
}
function touchCurrent() {
  const s = current();
  if (!s) return;
  s.updatedAt = Date.now();
  // 移到最前，形成 LRU 顺序
  sessions = [s, ...sessions.filter((x) => x.id !== s.id)];
  saveSessions();
  renderSessionList();
}
function switchTo(id) {
  if (busy || id === currentId) return;
  currentId = id;
  renderSessionList();
  renderMessages();
  inputEl.focus();
}
function deleteSession(id) {
  if (busy) return;
  const i = sessions.findIndex((s) => s.id === id);
  if (i < 0) return;
  sessions.splice(i, 1);
  if (currentId === id) {
    if (sessions.length) currentId = sessions[0].id;
    else { createSession(); return; }
  }
  saveSessions();
  renderSessionList();
  renderMessages();
}
function clearAllSessions() {
  if (busy) return;
  if (!confirm("确定清空全部历史会话？此操作不可恢复。")) return;
  sessions = [];
  createSession();
}
function renderSessionList() {
  sessionListEl.innerHTML = "";
  sessions.forEach((s) => {
    const item = document.createElement("div");
    item.className = "session-item" + (s.id === currentId ? " active" : "");
    item.dataset.id = s.id;
    const title = document.createElement("div");
    title.className = "session-title";
    title.textContent = s.title || "新会话";
    title.title = s.title || "新会话";
    const del = document.createElement("button");
    del.className = "session-del"; del.textContent = "×"; del.title = "删除此会话";
    del.addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
    item.appendChild(title);
    item.appendChild(del);
    item.addEventListener("click", () => switchTo(s.id));
    sessionListEl.appendChild(item);
  });
}
function renderMessages() {
  messagesEl.innerHTML = "";
  const s = current();
  if (!s || !s.messages.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "开始与「导演助手」对话吧 ✦";
    messagesEl.appendChild(empty);
    return;
  }
  s.messages.forEach(renderMessage);
}

/* ============ 消息渲染 ============ */
function addMessage(role) {
  // 移除空状态提示
  const empty = messagesEl.querySelector(".empty");
  if (empty) empty.remove();
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "🙋" : "🎬";
  const body = document.createElement("div");
  const meta = document.createElement("div");
  meta.className = "meta";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const attachments = document.createElement("div");
  attachments.className = "attachments";
  body.appendChild(meta);
  body.appendChild(bubble);
  body.appendChild(attachments);
  msg.appendChild(avatar);
  msg.appendChild(body);
  messagesEl.appendChild(msg);
  scrollDown();
  return { msg, meta, bubble, attachments };
}
// 从存储的消息对象重建 DOM（切换会话时使用）
function renderMessage(m) {
  const nodes = addMessage(m.role);
  if (m.role === "assistant") {
    if (m.thought) {
      const t = document.createElement("details");
      t.className = "thought";
      t.innerHTML = '<summary>💭 思考过程</summary><div class="content"></div>';
      t.querySelector(".content").textContent = m.thought;
      nodes.bubble.parentNode.insertBefore(t, nodes.bubble);
    }
    (m.tools || []).forEach((n) => nodes.meta.appendChild(chipFor("🔧 " + n)));
    (m.files || []).forEach((f) => renderFile(nodes.attachments, f));
    if (m.text) nodes.bubble.textContent = m.text;
    else if ((m.files || []).length) nodes.bubble.style.display = "none";
    else nodes.bubble.textContent = "(无文本输出)";
  } else {
    nodes.bubble.textContent = m.text || "";
  }
}
function scrollDown() { const m = document.querySelector("main"); m.scrollTop = m.scrollHeight; }

/* ============ 云端 Web UI 准入密码 ============ */
function showAuthOverlay(message = "") {
  authOverlayEl.classList.add("show");
  authOverlayEl.setAttribute("aria-hidden", "false");
  document.body.classList.add("auth-locked");
  authErrorEl.textContent = message;
  setTimeout(() => authPasswordEl.focus(), 0);
}
function hideAuthOverlay() {
  authOverlayEl.classList.remove("show");
  authOverlayEl.setAttribute("aria-hidden", "true");
  document.body.classList.remove("auth-locked");
  authErrorEl.textContent = "";
  authPasswordEl.value = "";
}
async function refreshAuthStatus() {
  const r = await fetch("/api/auth/status", { credentials: "same-origin" });
  const j = await r.json();
  authRequired = !!j.required;
  authAuthorized = !!j.authorized;
  if (authRequired && !authAuthorized) showAuthOverlay("");
  else hideAuthOverlay();
  return j;
}
async function ensureAuthorized() {
  const j = await refreshAuthStatus();
  if (j.required && !j.authorized) {
    showAuthOverlay("请输入准入密码");
    return false;
  }
  return true;
}
authFormEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = authPasswordEl.value;
  authSubmitEl.disabled = true;
  authErrorEl.textContent = "";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ password }),
    });
    if (!r.ok) {
      authErrorEl.textContent = "密码错误，请重试";
      authPasswordEl.select();
      return;
    }
    await refreshAuthStatus();
    await loadConfig();
  } catch (e) {
    authErrorEl.textContent = "登录失败，请稍后重试";
  } finally {
    authSubmitEl.disabled = false;
  }
});

/* ============ 图片放大查看（lightbox） ============ */
const lightboxEl = $("lightbox");
const lightboxImg = $("lightboxImg");
function openLightbox(url, alt) {
  lightboxImg.src = url;
  lightboxImg.alt = alt || "image";
  lightboxEl.classList.add("show");
  lightboxEl.setAttribute("aria-hidden", "false");
}
function closeLightbox() {
  lightboxEl.classList.remove("show");
  lightboxEl.setAttribute("aria-hidden", "true");
  lightboxImg.src = "";
}
// 点击遮罩层或放大后的图片任意位置都恢复；关闭按钮与 Esc 同样恢复
lightboxEl.addEventListener("click", closeLightbox);
$("lightboxClose").addEventListener("click", (e) => { e.stopPropagation(); closeLightbox(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && lightboxEl.classList.contains("show")) closeLightbox();
});

// 复制完整 URL（含签名参数）到剪贴板；成功后短暂反馈。
function copyFullUrl(url, btn) {
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = old; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}
function fallbackCopy(url, done) {
  const ta = document.createElement("textarea");
  ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done && done(); } catch (e) {}
  document.body.removeChild(ta);
}

async function downloadDoc(url, name, btn) {
  if (!(await ensureAuthorized())) return;
  const old = btn ? btn.textContent : "";
  if (btn) btn.textContent = "下载中";
  const finalUrl = url + (url.indexOf("?") >= 0 ? "&" : "?") + "download=1";
  try {
    const resp = await fetch(finalUrl, { credentials: "same-origin" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const blob = await resp.blob();
    const obj = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = obj; a.download = name || "";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(obj), 5000);
    if (btn) btn.textContent = "已下载";
  } catch (e) {
    if (btn) btn.textContent = "打开中";
    window.open(finalUrl, "_blank", "noopener");
  } finally {
    if (btn) setTimeout(() => { btn.textContent = old; }, 1500);
  }
}

// 渲染 Agent 生成的文件：图片直接显示、视频可播放、文档预览/下载
function renderFile(container, f) {
  if (f.kind === "image") {
    const a = document.createElement("a");
    a.className = "att-image-link";
    a.href = f.url; a.target = "_blank"; a.rel = "noopener";
    a.title = f.url;  // 悬停显示完整签名 URL（不截断）
    const img = document.createElement("img");
    img.className = "att-img"; img.src = f.url; img.alt = f.name || "image";
    img.loading = "lazy";
    // 点击缩略图在页面内放大查看（lightbox），再点击恢复；不再跳转新标签页
    a.addEventListener("click", (e) => { e.preventDefault(); openLightbox(f.url, f.name); });
    a.appendChild(img); container.appendChild(a);
  } else if (f.kind === "video") {
    const card = document.createElement("div");
    card.className = "att-video-card";
    const v = document.createElement("video");
    v.className = "att-video"; v.src = f.url; v.controls = true; v.preload = "metadata";
    v.playsInline = true;
    // 包底逻辑：若直连签名 URL 播放失败（CORS/防盗链），改用 BFF 代理拉取完整签名 URL。
    v.addEventListener("error", () => {
      if (v.dataset.proxied === "1") return;
      v.dataset.proxied = "1";
      v.src = "/api/video-proxy?url=" + encodeURIComponent(f.url);
      v.load();
    }, { once: true });
    const link = document.createElement("a");
    link.className = "att-video-link";
    link.href = f.url; link.target = "_blank"; link.rel = "noopener";
    link.title = f.url;  // 悬停显示完整签名 URL（不截断）
    link.textContent = "打开/下载视频：" + (f.name || f.url);
    const copyBtn = document.createElement("button");
    copyBtn.type = "button"; copyBtn.className = "secondary att-copy-url";
    copyBtn.textContent = "复制链接";
    copyBtn.addEventListener("click", () => copyFullUrl(f.url, copyBtn));
    card.appendChild(v);
    card.appendChild(link);
    card.appendChild(copyBtn);
    container.appendChild(card);
  } else if (f.kind === "doc") {
    const card = document.createElement("div");
    card.className = "att-doc";
    const icons = { pdf: "📕", docx: "📘", pptx: "📙", html: "🌐" };
    card.innerHTML =
      '<div class="icon">' + (icons[f.fmt] || "📄") + '</div>' +
      '<div class="info"><div class="fname"></div>' +
      '<div class="ftype">' + (f.fmt || "").toUpperCase() + ' 文档</div></div>';
    card.querySelector(".fname").textContent = f.name || "document";
    // PDF/HTML 提供内联预览按钮；所有文档都提供下载
    const canPreview = f.fmt === "pdf" || f.fmt === "html";
    if (canPreview) {
      const prev = document.createElement("button");
      prev.type = "button";
      prev.textContent = "预览"; prev.className = "secondary";
      const wrap = document.createElement("div");
      wrap.className = "doc-preview";
      prev.addEventListener("click", (e) => {
        e.preventDefault();
        if (wrap.dataset.open === "1") { wrap.innerHTML = ""; wrap.dataset.open = "0"; prev.textContent = "预览"; return; }
        const ifr = document.createElement("iframe");
        ifr.src = f.url; wrap.appendChild(ifr); wrap.dataset.open = "1"; prev.textContent = "收起"; scrollDown();
      });
      card.appendChild(prev);
      const dl = document.createElement("a");
      dl.textContent = "下载"; dl.href = f.url + (f.url.indexOf("?") >= 0 ? "&" : "?") + "download=1";
      dl.setAttribute("download", f.name || "");
      dl.addEventListener("click", (e) => {
        e.preventDefault();
        downloadDoc(f.url, f.name, dl);
      });
      card.appendChild(dl);
      container.appendChild(card);
      container.appendChild(wrap);
    } else {
      const dl = document.createElement("a");
      dl.textContent = "下载"; dl.href = f.url;
      dl.setAttribute("download", f.name || "");
      dl.addEventListener("click", (e) => {
        e.preventDefault();
        downloadDoc(f.url, f.name, dl);
      });
      card.appendChild(dl);
      container.appendChild(card);
    }
  }
  scrollDown();
}

async function loadConfig() {
  const r = await fetch("/api/config");
  const cfg = await r.json();
  targetEl.innerHTML = "";
  (cfg.targets || []).forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t.id; opt.textContent = t.label;
    targetEl.appendChild(opt);
  });
  if (cfg.default) targetEl.value = cfg.default;
  if (!cfg.targets || !cfg.targets.length) {
    $("statusText").textContent = "无可用目标（检查服务端配置）";
  } else {
    checkHealth();
  }
}

async function checkHealth() {
  const dot = $("dot"), txt = $("statusText");
  dot.className = "dot"; txt.textContent = "检测中…";
  try {
    const r = await fetch("/api/health?target=" + encodeURIComponent(targetEl.value));
    const j = await r.json();
    if (j.ok) { dot.className = "dot ok"; txt.textContent = "在线 · " + (j.apps || []).join(", "); }
    else { dot.className = "dot bad"; txt.textContent = "不可达"; }
  } catch (e) { dot.className = "dot bad"; txt.textContent = "不可达"; }
}

function chipFor(text) { const c = document.createElement("span"); c.className = "chip"; c.textContent = text; return c; }

function setBusy(next) {
  busy = next;
  sendBtn.disabled = next;
  document.body.classList.toggle("is-busy", next);
}

function setAutoMode(next) {
  autoMode = next;
  autoModeBtn.classList.toggle("active", autoMode);
  autoModeBtn.textContent = "自动：" + (autoMode ? "开" : "关");
  try { localStorage.setItem("awdir_auto_mode_v1", autoMode ? "1" : "0"); } catch (e) {}
  if (!autoMode) cancelAutoCountdown();
}

function shouldAutoContinue(text) {
  const t = (text || "").replace(/\s+/g, " ");
  // 1) 截断 / 预算 / 分段类硬信号
  if (/输出已截断|单次输出预算|MAX ?token|token ?上限|继续第\s*\d+\s*部分|继续后\s*\d+\s*集|继续下一[幕步集部]/i.test(t)) return true;
  // 2) 「请回复 / 直接回复 / 回复 …… 继续」——中间可夹 markdown 星号、引号、空格、冒号
  if (/(请|直接)?回复[\s`「」“”"':：*_]{0,16}继续/.test(t)) return true;
  // 3) 收束式提问（通常在结尾）：「先从哪一步继续？」「从哪里继续」「要不要继续」「继续吗？」等
  const tail = t.slice(-120);
  if (/(从哪一?步|从哪里|哪一步|要不要|是否|需要我|接下来是否|可以)?\s*继续(创作|生成|下一[幕步集部]|吗|呢)?\s*[？?]/.test(tail)) return true;
  if (/(从哪一?步|从哪里|哪一步)\s*继续/.test(tail)) return true;
  return false;
}

function cancelAutoCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = null;
  if (countdownCancel) {
    ["pointerdown", "keydown", "input", "touchstart"].forEach((ev) =>
      window.removeEventListener(ev, countdownCancel, true)
    );
  }
  countdownCancel = null;
  autoBannerEl.classList.remove("show");
  autoBannerEl.textContent = "";
}

function startAutoCountdown() {
  if (!autoMode || busy) return;
  cancelAutoCountdown();
  let left = 10;
  const render = () => {
    autoBannerEl.innerHTML =
      '<span class="countdown">' + left +
      '</span> 秒后自动「继续」，任意操作可取消。';
    autoBannerEl.classList.add("show");
  };
  countdownCancel = () => cancelAutoCountdown();
  ["pointerdown", "keydown", "input", "touchstart"].forEach((ev) =>
    window.addEventListener(ev, countdownCancel, true)
  );
  render();
  countdownTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      cancelAutoCountdown();
      send("继续", { auto: true });
      return;
    }
    render();
  }, 1000);
}

function stopCurrentRun() {
  if (!activeController || !activeRun) return;
  activeRun.stopped = true;
  activeController.abort();
  const s = current();
  if (s && s.id === activeRun.sessionId) {
    s.messages.splice(activeRun.startIndex, 2);
    if (!s.messages.length) s.title = "新会话";
    saveSessions();
    renderSessionList();
    renderMessages();
  }
  inputEl.value = activeRun.message;
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  cancelAutoCountdown();
  setBusy(false);
  activeController = null;
  activeRun = null;
  inputEl.focus();
}

async function send(messageOverride = null, opts = {}) {
  const message = (messageOverride ?? inputEl.value).trim();
  if (!message || busy) return;
  if (!(await ensureAuthorized())) return;
  cancelAutoCountdown();
  setBusy(true);
  inputEl.value = ""; inputEl.style.height = "auto";

  const s = current();
  if (!s) { setBusy(false); return; }
  // 首条用户消息作为会话标题；自动续写不改标题
  if (!opts.auto && (!s.title || s.title === "新会话")) s.title = message.slice(0, 24) || "新会话";
  const userMsg = { role: "user", text: message };
  const asstMsg = { role: "assistant", text: "", thought: "", tools: [], files: [] };
  const startIndex = s.messages.length;
  s.messages.push(userMsg, asstMsg);
  touchCurrent();

  const empty = messagesEl.querySelector(".empty");
  if (empty) empty.remove();
  addMessage("user").bubble.textContent = message;
  const asst = addMessage("assistant");
  asst.bubble.classList.add("blink");

  let mainText = "";
  let thoughtText = "";
  let thoughtEl = null;
  const seenTools = new Set();
  const seenFiles = new Set();
  const controller = new AbortController();
  const run = { sessionId: s.id, startIndex, message, stopped: false };
  activeController = controller;
  activeRun = run;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target: targetEl.value, message, session_id: s.id }),
      signal: controller.signal,
    });
    if (!resp.ok || !resp.body) {
      asst.bubble.classList.remove("blink");
      asst.bubble.textContent = "请求失败：HTTP " + resp.status;
      asstMsg.text = asst.bubble.textContent; saveSessions();
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const rawEvent = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = rawEvent.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.type === "text") {
          mainText += ev.text; asst.bubble.textContent = mainText; asstMsg.text = mainText; scrollDown();
        } else if (ev.type === "thought") {
          thoughtText += ev.text; asstMsg.thought = thoughtText;
          if (!thoughtEl) {
            thoughtEl = document.createElement("details");
            thoughtEl.className = "thought";
            thoughtEl.innerHTML = '<summary>💭 思考过程</summary><div class="content"></div>';
            asst.bubble.parentNode.insertBefore(thoughtEl, asst.bubble);
          }
          thoughtEl.querySelector(".content").textContent = thoughtText;
        } else if (ev.type === "tool_call") {
          const key = "call:" + ev.name;
          if (!seenTools.has(key)) { seenTools.add(key); asstMsg.tools.push(ev.name); asst.meta.appendChild(chipFor("🔧 " + ev.name)); }
        } else if (ev.type === "file") {
          const key = "file:" + (ev.url || "") + (ev.name || "");
          if (!seenFiles.has(key)) {
            seenFiles.add(key);
            asstMsg.files.push({ kind: ev.kind, url: ev.url, name: ev.name, fmt: ev.fmt });
            renderFile(asst.attachments, ev);
          }
        } else if (ev.type === "error") {
          asst.bubble.classList.remove("blink");
          mainText += (mainText ? "\n\n" : "") + "⚠️ " + ev.error;
          asst.bubble.textContent = mainText; asstMsg.text = mainText;
        } else if (ev.type === "done") {
          asst.bubble.classList.remove("blink");
        }
      }
    }
  } catch (e) {
    if (run.stopped) return;
    asst.bubble.textContent = e && e.name === "AbortError" ? "已打断。" : "网络错误：" + e;
    asstMsg.text = asst.bubble.textContent;
  } finally {
    const stopped = run.stopped;
    if (activeRun === run) {
      activeController = null;
      activeRun = null;
    }
    if (!stopped) {
      asst.bubble.classList.remove("blink");
      if (!mainText) {
        if (seenFiles.size > 0) { asst.bubble.style.display = "none"; }
        else { asst.bubble.textContent = "(无文本输出)"; }
      }
      asstMsg.text = mainText || asstMsg.text;
      saveSessions();
      setBusy(false);
      inputEl.focus();
      if (shouldAutoContinue(asstMsg.text)) startAutoCountdown();
    }
  }
}

sendBtn.addEventListener("click", () => send());
stopBtn.addEventListener("click", stopCurrentRun);
autoModeBtn.addEventListener("click", () => setAutoMode(!autoMode));
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});
targetEl.addEventListener("change", checkHealth);
$("newChat").addEventListener("click", () => { if (!busy) createSession(); });
$("clearAll").addEventListener("click", clearAllSessions);

/* ============ 侧栏折叠 / 展开 ============ */
const SIDEBAR_KEY = "awdir_sidebar_open_v1";
const sidebarEl = $("sidebar");
const backdropEl = $("sidebarBackdrop");
function setSidebar(open) {
  sidebarEl.classList.toggle("collapsed", !open);
  document.body.classList.toggle("sidebar-open", open);
  try { localStorage.setItem(SIDEBAR_KEY, open ? "1" : "0"); } catch (e) {}
}
$("expandSidebar").addEventListener("click", () => setSidebar(true));
$("collapseSidebar").addEventListener("click", () => setSidebar(false));
backdropEl.addEventListener("click", () => setSidebar(false));
// 默认闭合：仅当用户上次显式展开过，才恢复展开
try {
  if (localStorage.getItem(SIDEBAR_KEY) === "1") setSidebar(true);
} catch (e) {}

try {
  setAutoMode(localStorage.getItem("awdir_auto_mode_v1") !== "0");
} catch (e) { setAutoMode(true); }

// 初始化：加载历史会话或创建首个会话
sessions = loadSessions();
if (!sessions.length) {
  createSession();
} else {
  currentId = sessions[0].id;
  renderSessionList();
  renderMessages();
}
async function bootstrap() {
  await refreshAuthStatus();
  if (!authRequired || authAuthorized) {
    await loadConfig();
  }
}
bootstrap();
</script>
